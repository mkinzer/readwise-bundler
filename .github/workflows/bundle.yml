name: Make listening bundles

on:
  schedule:
    # 07:47 UTC is 2:47 am in New York in winter and 3:47 am in summer.
    # Off the hour on purpose: GitHub delays jobs scheduled on the hour.
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would happen; change nothing in Reader"
        type: boolean
        default: false
      thumbnails:
        description: "Thumbnail style (alternate: odd bundles get a collage, even ones a list of titles)"
        type: choice
        options: [alternate, collage, list, none]
        default: alternate
      refresh_existing:
        description: "First give the bundles already waiting the new title format and a thumbnail"
        type: boolean
        default: false

# contents: write lets the job save thumbnails to the "thumbnails" branch,
# which Reader loads them from. It needs the repository to be public.
permissions:
  contents: write

concurrency:
  group: readwise-bundler
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
      # Optional: without it, title labels are taken from the article titles.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      BUNDLER_THUMBNAILS: ${{ inputs.thumbnails || vars.BUNDLER_THUMBNAILS || 'alternate' }}
    steps:
      # Until the Readwise token is added, runs finish green and do nothing.
      - name: Check configuration
        id: config
        run: echo "ready=${{ secrets.READWISE_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Explain skip
        if: steps.config.outputs.ready != 'true'
        run: echo "::notice::Skipping. Add READWISE_TOKEN under Settings > Secrets and variables > Actions."

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install --quiet -r requirements.txt
      - name: Test
        if: steps.config.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ""
          GITHUB_TOKEN: ""
        run: python -m unittest discover -s tests -t tests
      - name: Refresh waiting bundles
        if: steps.config.outputs.ready == 'true' && inputs.refresh_existing
        run: python -m readwise_bundler refresh ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Make bundles
        if: steps.config.outputs.ready == 'true'
        run: python -m readwise_bundler run ${{ inputs.dry_run && '--dry-run' || '' }}
